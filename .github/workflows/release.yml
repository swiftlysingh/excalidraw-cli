name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (for example v1.3.0)'
        required: true

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    permissions:
      contents: write
    steps:
      - name: Resolve release tag
        id: release_tag
        run: |
          git check-ref-format "refs/tags/$RELEASE_TAG"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ steps.release_tag.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag matches package version
        id: version_check
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          EXPECTED_TAG="v${PACKAGE_VERSION}"
          ACTUAL_TAG="$RELEASE_TAG"

          echo "package_version=${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"

          if [ "$ACTUAL_TAG" != "$EXPECTED_TAG" ]; then
            echo "Tag mismatch: expected $EXPECTED_TAG, got $ACTUAL_TAG" >&2
            exit 1
          fi

      - name: Check release credentials
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ] || [ -z "$HOMEBREW_TAP_GITHUB_TOKEN" ]; then
            echo "Configure NPM_TOKEN and HOMEBREW_TAP_GITHUB_TOKEN before releasing." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm run test:run

      - name: Run linter
        run: npm run lint

      - name: Publish to npm
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          # A registry failure must stop the release, not look like an unpublished version.
          npm view "$PACKAGE_NAME" versions --json > "$RUNNER_TEMP/npm-versions.json"
          PUBLISHED=$(node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const { version } = require('./package.json');
          const versions = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/npm-versions.json`, 'utf8'));
          if (!Array.isArray(versions) || !versions.every(value => typeof value === 'string')) {
            throw new Error('Unexpected npm versions response');
          }
          console.log(versions.includes(version));
          NODE
          )
          if [ "$PUBLISHED" = "true" ]; then
            echo "$PACKAGE_NAME is already published at this version; continuing the release."
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ${{ steps.release_tag.outputs.tag }}
          generate_release_notes: true
          body: |
            ## Installation
            ```bash
            npm install -g @swiftlysingh/excalidraw-cli
            brew tap swiftlysingh/tap
            brew install excalidraw-cli
            ```

            📦 [View on npm](https://www.npmjs.com/package/@swiftlysingh/excalidraw-cli/v/${{ steps.version_check.outputs.package_version }})

      - name: Compute release artifact SHA256
        id: asset
        run: |
          VERSION="${{ steps.version_check.outputs.package_version }}"
          TARBALL_URL=$(npm view "@swiftlysingh/excalidraw-cli@$VERSION" dist.tarball)
          curl --fail --location --show-error --retry 3 "$TARBALL_URL" -o release.tar.gz
          SHA256=$(sha256sum release.tar.gz | awk '{print $1}')
          echo "tarball_url=$TARBALL_URL" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Generate Homebrew formula
        env:
          TARBALL_URL: ${{ steps.asset.outputs.tarball_url }}
          TARBALL_SHA256: ${{ steps.asset.outputs.sha256 }}
        run: |
          if [[ ! "$TARBALL_URL" =~ ^https://registry\.npmjs\.org/@swiftlysingh/excalidraw-cli/-/[A-Za-z0-9._-]+\.tgz$ ]] ||
             [[ ! "$TARBALL_SHA256" =~ ^[a-f0-9]{64}$ ]]; then
            echo "Invalid npm tarball URL or SHA256." >&2
            exit 1
          fi
          mkdir -p Formula
          cat > Formula/excalidraw-cli.rb <<EOF
          class ExcalidrawCli < Formula
            desc "CLI for creating Excalidraw flowcharts programmatically"
            homepage "https://github.com/$GITHUB_REPOSITORY"
            url "$TARBALL_URL"
            sha256 "$TARBALL_SHA256"
            license "MIT"

            depends_on "node"

            def install
              system "npm", "install", *std_npm_args
              bin.install_symlink Dir["#{libexec}/bin/*"]
              man1.install "man/excalidraw-cli.1"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/excalidraw-cli --version")
              system bin/"excalidraw-cli", "create", "--inline", "[A] -> [B]", "-o", "flow.excalidraw"
              assert_equal "excalidraw", JSON.parse((testpath/"flow.excalidraw").read).fetch("type")
              system bin/"excalidraw-cli", "convert", "flow.excalidraw", "--format", "svg"
              assert_match "<svg", (testpath/"flow.svg").read
              system bin/"excalidraw-cli", "convert", "flow.excalidraw", "--format", "png"
              assert_equal "\x89PNG\r\n\x1a\n".b, (testpath/"flow.png").binread[0, 8]
            end
          end
          EOF

      - name: Validate Homebrew formula
        run: |
          export PATH="$PATH:/home/linuxbrew/.linuxbrew/bin"
          eval "$(brew shellenv)"
          brew tap-new local/release-check
          cp Formula/excalidraw-cli.rb "$(brew --repository local/release-check)/Formula/excalidraw-cli.rb"
          brew install --build-from-source local/release-check/excalidraw-cli
          brew test local/release-check/excalidraw-cli

      - name: Push Homebrew formula to tap
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git clone "https://x-access-token:${HOMEBREW_TAP_GITHUB_TOKEN}@github.com/swiftlysingh/homebrew-tap.git" homebrew-tap
          cp Formula/excalidraw-cli.rb homebrew-tap/Formula/excalidraw-cli.rb

          cd homebrew-tap
          git add Formula/excalidraw-cli.rb
          if git diff --cached --quiet; then
            echo "No Homebrew formula changes to commit"
            exit 0
          fi
          git commit -m "Update excalidraw-cli formula for $RELEASE_TAG"
          git push origin main
