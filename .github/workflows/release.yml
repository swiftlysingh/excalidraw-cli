name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Create a minor release or retry an existing tag'
        type: choice
        options: [new, retry]
        default: new
      tag:
        description: 'Existing tag, required only for retry (for example v1.3.0)'
        required: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    permissions:
      contents: write
    steps:
      - name: Resolve release tag
        id: target
        env:
          INPUT_MODE: ${{ inputs.mode || 'new' }}
        run: |
          MODE="$INPUT_MODE"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then MODE=retry; fi
          case "$MODE" in
            new)
              if [ "$GITHUB_REF" != "refs/heads/main" ] || [ "$GITHUB_RUN_ATTEMPT" != "1" ]; then
                echo "Start a new release from main. To resume an existing release, dispatch retry with its tag." >&2
                exit 1
              fi
              echo "ref=refs/heads/main" >> "$GITHUB_OUTPUT"
              ;;
            retry)
              if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
                echo "Retry requires an existing stable tag such as v1.3.0." >&2
                exit 1
              fi
              echo "ref=refs/tags/$RELEASE_TAG" >> "$GITHUB_OUTPUT"
              ;;
            *) echo "Unknown release mode." >&2; exit 1 ;;
          esac
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.target.outputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Prepare release version
        id: release_tag
        env:
          MODE: ${{ steps.target.outputs.mode }}
        run: |
          if [ "$MODE" = "new" ]; then
            git tag --list > "$RUNNER_TEMP/release-tags"
            VERSION=$(node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const versions = fs.readFileSync(`${process.env.RUNNER_TEMP}/release-tags`, 'utf8')
            .split('\n')
            .filter(tag => /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.test(tag))
            .map(tag => tag.slice(1).split('.').map(Number))
            .sort((a, b) => b[0] - a[0] || b[1] - a[1] || b[2] - a[2]);
          if (!versions.length) throw new Error('No stable release tag found.');
          const [major, minor] = versions[0];
          console.log(`${major}.${minor + 1}.0`);
          NODE
            )
            npm version "$VERSION" --no-git-tag-version --allow-same-version --ignore-scripts
            RELEASE_TAG="v$VERSION"
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "Release: $RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "If publication fails after tagging, dispatch retry with $RELEASE_TAG." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify tag matches package version
        id: version_check
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          EXPECTED_TAG="v${PACKAGE_VERSION}"
          ACTUAL_TAG="$RELEASE_TAG"

          echo "package_version=${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"

          if [ "$ACTUAL_TAG" != "$EXPECTED_TAG" ]; then
            echo "Tag mismatch: expected $EXPECTED_TAG, got $ACTUAL_TAG" >&2
            exit 1
          fi

      - name: Check release credentials
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ] || [ -z "$HOMEBREW_TAP_GITHUB_TOKEN" ]; then
            echo "Configure NPM_TOKEN and HOMEBREW_TAP_GITHUB_TOKEN before releasing." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm run test:run

      - name: Run linter
        run: npm run lint

      - name: Create release tag
        if: steps.target.outputs.mode == 'new'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --detach
          git add package.json package-lock.json
          git commit --allow-empty -m "Release $RELEASE_TAG"
          git tag "$RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Publish to npm
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          # A registry failure must stop the release, not look like an unpublished version.
          npm view "$PACKAGE_NAME" versions --json > "$RUNNER_TEMP/npm-versions.json"
          PUBLISHED=$(node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const { version } = require('./package.json');
          const versions = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/npm-versions.json`, 'utf8'));
          if (!Array.isArray(versions) || !versions.every(value => typeof value === 'string')) {
            throw new Error('Unexpected npm versions response');
          }
          console.log(versions.includes(version));
          NODE
          )
          if [ "$PUBLISHED" = "true" ]; then
            echo "$PACKAGE_NAME is already published at this version; continuing the release."
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ${{ steps.release_tag.outputs.tag }}
          generate_release_notes: true
          body: |
            ## Installation
            ```bash
            npm install -g @swiftlysingh/excalidraw-cli
            brew tap swiftlysingh/tap
            brew install excalidraw-cli
            ```

            📦 [View on npm](https://www.npmjs.com/package/@swiftlysingh/excalidraw-cli/v/${{ steps.version_check.outputs.package_version }})

      - name: Compute release artifact SHA256
        id: asset
        env:
          VERSION: ${{ steps.version_check.outputs.package_version }}
        run: |
          TARBALL_URL=$(npm view "@swiftlysingh/excalidraw-cli@$VERSION" dist.tarball)
          if [[ ! "$TARBALL_URL" =~ ^https://registry\.npmjs\.org/@swiftlysingh/excalidraw-cli/-/[A-Za-z0-9._-]+\.tgz$ ]]; then
            echo "Invalid npm tarball URL." >&2
            exit 1
          fi
          curl --fail --location --show-error --retry 3 "$TARBALL_URL" -o release.tar.gz
          SHA256=$(sha256sum release.tar.gz | awk '{print $1}')
          echo "tarball_url=$TARBALL_URL" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Generate Homebrew formula
        env:
          TARBALL_URL: ${{ steps.asset.outputs.tarball_url }}
          TARBALL_SHA256: ${{ steps.asset.outputs.sha256 }}
        run: |
          if [[ ! "$TARBALL_URL" =~ ^https://registry\.npmjs\.org/@swiftlysingh/excalidraw-cli/-/[A-Za-z0-9._-]+\.tgz$ ]] ||
             [[ ! "$TARBALL_SHA256" =~ ^[a-f0-9]{64}$ ]]; then
            echo "Invalid npm tarball URL or SHA256." >&2
            exit 1
          fi
          mkdir -p Formula
          cat > Formula/excalidraw-cli.rb <<EOF
          class ExcalidrawCli < Formula
            desc "CLI for creating Excalidraw flowcharts programmatically"
            homepage "https://github.com/$GITHUB_REPOSITORY"
            url "$TARBALL_URL"
            sha256 "$TARBALL_SHA256"
            license "MIT"

            depends_on "node"

            def install
              system "npm", "install", *std_npm_args
              bin.install_symlink Dir["#{libexec}/bin/*"]
              man1.install "man/excalidraw-cli.1"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/excalidraw-cli --version")
              system bin/"excalidraw-cli", "create", "--inline", "[A] -> [B]", "-o", "flow.excalidraw"
              assert_equal "excalidraw", JSON.parse((testpath/"flow.excalidraw").read).fetch("type")
              system bin/"excalidraw-cli", "convert", "flow.excalidraw", "--format", "svg"
              assert_match "<svg", (testpath/"flow.svg").read
              system bin/"excalidraw-cli", "convert", "flow.excalidraw", "--format", "png"
              assert_equal "\x89PNG\r\n\x1a\n".b, (testpath/"flow.png").binread[0, 8]
            end
          end
          EOF

      - name: Validate Homebrew formula
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          export PATH="$PATH:/home/linuxbrew/.linuxbrew/bin"
          eval "$(brew shellenv)"
          brew tap-new local/release-check
          cp Formula/excalidraw-cli.rb "$(brew --repository local/release-check)/Formula/excalidraw-cli.rb"
          brew install --build-from-source local/release-check/excalidraw-cli
          brew test local/release-check/excalidraw-cli

      - name: Push Homebrew formula to tap
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${HOMEBREW_TAP_GITHUB_TOKEN}@github.com/swiftlysingh/homebrew-tap.git" homebrew-tap
          cp Formula/excalidraw-cli.rb homebrew-tap/Formula/excalidraw-cli.rb

          cd homebrew-tap
          git add Formula/excalidraw-cli.rb
          if git diff --cached --quiet; then
            echo "No Homebrew formula changes to commit"
            exit 0
          fi
          git commit -m "Update excalidraw-cli formula for $RELEASE_TAG"
          git push origin main
